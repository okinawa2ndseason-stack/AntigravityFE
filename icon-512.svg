<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#131d33"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景円 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="124" fill="none" stroke="#1e293b" stroke-width="6"/>
  
  <!-- グローシンボル -->
  <g filter="url(#glow)">
    <!-- 脳・ネットワークシンボル -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-dasharray="16 10"/>
    <circle cx="256" cy="256" r="90" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
    
    <!-- 稲妻 / レトリーバル想起アイコン -->
    <path d="M275 160 L200 270 L250 270 L235 352 L315 240 L265 240 Z" fill="url(#cyanGrad)"/>
  </g>
  
  <!-- テキストロゴ FE -->
  <text x="256" y="440" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="44" font-weight="900" fill="#f1f5f9" text-anchor="middle" letter-spacing="4">FE-BRAINLAB</text>
</svg>
